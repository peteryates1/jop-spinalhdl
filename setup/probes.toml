# THIS LAB'S JTAG PROBES -- the setup layer (status item 173).
#
# Read by fpga/scripts/jtag_probe_map through fpga/scripts/jop_setup.py, which
# refuses unknown keys, unknown kinds and malformed IDCODEs. One table per
# ALIAS. An alias names whatever its serial is attached to: a probe soldered to
# a board names that board, while a standalone cable (the Terasic, the Wukong's
# Pico 2 W) names whatever it is plugged into, and moving it silently
# retargets the alias.
#
#   serial       the USB iSerialNumber. jtag_probe_map matches by a two-way
#                prefix test, so give a Pico's full 16 characters.
#   kind         usb-blaster | arrow-usb-blaster | pico | cmsis-dap | ftdi-xilinx;
#                it picks the chain-scan backend and, in
#                check-probe-selection.sh, the programming tool.
#   idcode       the FPGA `--assert-device` expects on the chain, as the
#                scanning tool PRINTS it (see jtag_probe_map). Left out = no check.
#   device       what that IDCODE is.
#   description  free text, joined onto one line.
#
# Every entry was verified against this host; do not add one from a datasheet.
#
# TWO USB-BLASTERS ARE ATTACHED (since 2026-08-29): the Terasic and the
# pico-usb-debug-jtag carrier's JTAG0, a level-shifted pico-usb-blaster. Their
# product strings differ ("USB-Blaster" vs "USB Blaster"), but selection is by
# serial and port path anyway. THE TWO ALTERA BOARDS SWAPPED CABLES on
# 2026-10-27: the Terasic drives the EP4CGX150, and the carrier drives the
# A-E115FB, whose chain the Terasic dropped mid-stream. The cables have moved
# five times since 2026-08-29; trust the entries, not this note.
#
# IDCODES. The Wukong and the DB_FPGA V5 both carry an XC7A100T, so both read
# 03631093; each is on its own dirtyJtag probe, and --busdev picks the probe.
# What the check therefore cannot catch: the DB_FPGA V5's RP2040 is ON the
# board, so `xc7a100t` cannot drift, but the Wukong's Pico 2 W is a standalone
# cable -- move it onto the DB_FPGA V5 and `--assert-device wukong` still
# passes. Two probes have no idcode on purpose, because the check could not
# run: `alchitry` is programmed through Vivado's hw_server, which neither scan
# backend drives, and quartus_pgm never enumerates the CYC5000's Arrow blaster
# (`quartus_pgm -l` on 18.1 and 25.1, measured 2026-09-04; openFPGALoader's
# arrow-usb-blaster cable was not tried).

[terasic]
serial = "91d28408"
kind = "usb-blaster"
description = '''
Terasic USB-Blaster — a CABLE, not a board; on the EP4CGX150 from
2026-08-31, MOVED to the A-E115FB on 2026-10-12, and BACK to the EP4CGX150
on 2026-10-27, so `terasic` and `ep4cgx150` now resolve alike'''

[xc7a100t]
serial = "E662C876C3506A26"
kind = "pico"
idcode = "03631093"
device = "XC7A100T — Artix-7 (QMTECH core board + DB_FPGA V5)"
description = '''
QMTECH XC7A100T + DB_FPGA V5. The RP2040 is ON the DB_FPGA V5 itself, so
this alias names a BOARD and the serial is permanent. Full 16-char RP2040
serial: `serial_matches` is a bidirectional prefix test, so it still matches
the 8 chars pico-usb-blaster reports, whereas an 8-char entry would also
match a different Pico sharing that prefix'''

[ae115fb]
serial = "e66440a2"
kind = "usb-blaster"
idcode = "020F70DD"
device = "EP4CE115 (IDCODE shared with EP3C120 / 10CL120)"
description = '''
A-E115FB EP4CE115 + 1GB DDR2 — on the pico-usb-debug-jtag carrier's JTAG0
(J5) since 2026-10-27, swapped with the EP4CGX150's cable; Quartus shows the
carrier as "USB Blaster" (space), and it configures this board in ~41 s. On
the Terasic (2026-10-12 to 10-27) IDCODE scans passed 20/20 but the chain
dropped mid-stream: a 5.2 Mbit BYPASS test failed 2 runs in 3 with TDO all
ones, so every configuration failed. After the swap both cables passed 3/3,
so it was that pairing or its seating, not either part. Its own
level-shifted Pico blaster, e6616408, STOPPED WORKING on 2026-09-07: the
symptom was cable enumerates, TDO empty, port re-enumerating, CH340 console
opens but silent. The JTAG pins run from bank 1, whose VCCIO is jumper J2
(found at 2.5 V on 2026-10-12)'''

[ep4cgx150]
serial = "91d28408"
kind = "usb-blaster"
idcode = "028040DD"
device = "EP4CGX150 — Cyclone IV GX"
description = '''
QMTECH EP4CGX150 + SDR — on the Terasic since 2026-10-27 (swapped with the
A-E115FB's cable; configures in ~10 s). From 2026-10-15 to 10-27 it was on
the pico-usb-debug-jtag carrier's JTAG0 (J5): an RP2040 Pico running
pico-usb-blaster BOARD_DEBUG_JTAG0, every line through an SN74LVC1T45
referenced to the target's VTREF (2.5 V here); Quartus shows it as "USB
Blaster" (space). The carrier is a CABLE, not part of the board, like the
Terasic. Its first bring-up was blocked by a solder bridge across R15 (GP11
DIR pull-down): DIR read 0.72 V and the outbound shifters ran B->A'''

[debugprobe]
serial = "E6647C740343412F"
kind = "cmsis-dap"
description = '''
Raspberry Pi Debug Probe (SWD, for flashing Picos)'''

[cyc5000]
serial = "ARA30135"
kind = "arrow-usb-blaster"
description = '''
Arrow CYC5000 (onboard Arrow USB Blaster TEI0050, FT2232H)'''

[i5]
serial = "07000001002700424e"
kind = "cmsis-dap"
idcode = "41111043"
device = "LFE5U-25 — ECP5"
description = '''
Colorlight i5 on the ext board (DAPLink, also the UART bridge)'''

[wukong]
serial = "0B383D0435D957EC"
kind = "pico"
idcode = "03631093"
device = "XC7A100T — Artix-7 (QMTECH Wukong)"
description = '''
QMTECH Wukong XC7A100T (Pico 2 W: dirtyJtag, or USB-Blaster emulation under
the atari800 supervisor firmware). A STANDALONE Pico W -- a cable, not part
of the board -- so this alias names whatever it is currently plugged into,
the way `terasic` does. Unplugging it and using it elsewhere silently
retargets this alias'''

[colorlight-db]
serial = "4636323337051B1B"
kind = "pico"
idcode = "0362C093"
device = "XC7A50T — Artix-7 (Colorlight i9+ on the fpga-db-colorlight-i5 base board; an i5/i9 module would read differently)"
description = '''
fpga-db-colorlight-i5 base board (netlist 2026-10-10) carrying the i9+: its
RP2040-STAMP runs pico-dirtyJtag BOARD_COLORLIGHT_DB, JTAG on GPIO0-3. The
stamp is SOCKETED, so this serial names a STAMP, and the board only while
the stamp stays in it. Since 2026-10-26 it is the SECOND stamp: the first
(4636323337058419, pins verified 2026-10-10 with no module fitted) went to
the second base board, the one with the i5 (alias colorlight-db-i5), whose
USB was faulty until 2026-10-27 (a VBUS-to-D- leak at J4, reworked and
cleaned). This stamp VERIFIED here 2026-10-26: IDCODE 0362C093 5/5, and the
i9+ bitstream loaded through it'''

[colorlight-db-i5]
serial = "4636323337058419"
kind = "pico"
idcode = "41111043"
device = "LFE5U-25 — ECP5 (Colorlight i5 on the second fpga-db-colorlight-i5 base board)"
description = '''
fpga-db-colorlight-i5 base board, its SECOND unit, carrying the i5 (ECP5).
Its RP2040-STAMP is socketed and stays in this unit (user, 2026-10-27); it
was the first unit's stamp until 2026-10-26, and runs that board's
pico-dirtyJtag BOARD_COLORLIGHT_DB image (build-colorlight-pico), JTAG on
GPIO0-3. The unit's USB was faulty until 2026-10-27 (VBUS-to-D- leak at J4,
reworked and cleaned). VERIFIED 2026-10-27 through it: IDCODE 41111043
500/500, the i5's flash written (idle image), the RGMII bring-up loaded'''

[alchitry]
serial = "000000"
kind = "ftdi-xilinx"
description = '''
Alchitry Au V2 (XC7A35T + DDR3) — onboard FT2232H, programmed by Vivado
hw_server (see fpga/alchitry-au). Shares vid:pid 0403:6010 with the
CYC5000's Arrow blaster; the serial and product string are what separate
them. fpga/alchitry-au-ddr3-test is a second PROJECT on this same board, not
another board'''
