name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The JVM-suite sims run on push as well as here (see jvm-suite-sims). The
    # nightly is kept as a backstop: it catches anything that only shows up
    # intermittently, and it still runs when nobody has pushed for a day.
    - cron: '0 3 * * *'

permissions:
  checks: write
  contents: read

# github.event_name is in the group deliberately. Without it a push and the
# nightly schedule share a group on refs/heads/main, so a push CANCELS an
# in-progress scheduled run -- which happened to the 2026-08-18 03:47 run.
# That is the one run of the day that exercises the schedule-only jobs, so
# losing it silently costs exactly the coverage the comment on jvm-suite-sims
# is worried about. Pushes still cancel each other, which is the intent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Build Java tools + microcode assembly
  # Produces build/microcode/<variant>/ (Scala sources + ROM/RAM data files)
  # ----------------------------------------------------------------
  build-microcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Java tools (jopa.jar)
        run: make -C java/tools dist/jopa.jar

      - name: Build microcode (superset ROM)
        # `all` covers simulation, serial and flash-altera. It used to build only
        # the first two, which is why this named the others explicitly -- and why
        # a local `make -C asm all` left the flash variant 16 days stale while CI
        # was fine.
        run: make -C asm all

      - name: Upload microcode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microcode
          path: build/microcode/
          retention-days: 1

  # ----------------------------------------------------------------
  # SBT compile + Verilog generation
  # ----------------------------------------------------------------
  # THE README IS THE TEST. Both jobs execute the commands in README.md's
  # "Build and Run Simulation" block rather than a copy of them, so the docs
  # and CI cannot drift: edit a command there and this runs the edited one.
  #
  # Split by step number, not by two lists. Steps 1-7 are ~6 minutes and gate
  # every push; step 8 (JopSmpBramSim) runs until a collection actually happens,
  # ~54M cycles, measured at 25 min unloaded and 48 min contended -- too long to
  # sit in front of a push, so it runs nightly.
  #
  # Its first run found that step 2's `sbt compile` executed in asm/ -- step 1
  # leaves you there and step 2 only said "from project root" in a comment. It
  # reported success while compiling none of the HDL, and self-healed later
  # because the runMain steps compile from the root. Two cold-newcomer agents
  # missed it because they ran the commands sensibly rather than literally. A
  # script does not.
  readme-walkthrough:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # JDK 8 for the JOP runtime and apps -- step 3 needs it. The runtime
      # compiles -source/-target 1.6, JDK 9 dropped target 6 and BCEL 5.2
      # cannot read newer class files, so 8 is the only version that works.
      # JAVA_HOME stays on 17 for sbt; only the app compiler is pinned.
      - name: Set up JDK 8 for the JOP runtime
        id: jdk8_walk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17 (sbt)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No microcode download here on purpose: step 1 of the walk-through builds
      # it, and the point is to prove the README's own sequence works from a
      # clean checkout.
      - name: Run the README walk-through (steps 1-7)
        env:
          TARGET_JDK_HOME: ${{ steps.jdk8_walk.outputs.path }}
        run: .github/scripts/run-readme-walkthrough.sh 1-7

  # Step 8 only. Nightly and on demand -- see the note above.
  readme-walkthrough-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Set up JDK 8 for the JOP runtime
        id: jdk8_long
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17 (sbt)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Steps 1-3 build what step 8 needs; 4-7 are covered on every push.
      - name: Build prerequisites (steps 1-3)
        env:
          TARGET_JDK_HOME: ${{ steps.jdk8_long.outputs.path }}
        run: .github/scripts/run-readme-walkthrough.sh 1-3

      - name: Run the long simulation (step 8)
        env:
          TARGET_JDK_HOME: ${{ steps.jdk8_long.outputs.path }}
        run: .github/scripts/run-readme-walkthrough.sh 8-8

  # Seconds, and needs no toolchain -- these read make's rule database and run
  # the guards, not the tree state. Two defects, both of which let the flow
  # SUCCEED while being wrong: quartus.mk wrote the .sdc and setup_proj.tcl from
  # rules with no prerequisites, so a pin change reached the RTL and not the
  # constraints; and console.mk's derived BAUD could expand to empty, which
  # download.py then silently replaced with 2000000.
  # Deliberately not gated on build-microcode: nothing here compiles.
  check-build-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build-graph guards
        run: make check-build

  compile-and-generate:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: build/microcode/

      - name: SBT compile (main + test)
        run: sbt -J-Xmx4g compile Test/compile

      - name: Generate Verilog
        run: sbt -J-Xmx4g "runMain jop.system.JopCoreVerilog"

  # ----------------------------------------------------------------
  # Formal verification (yosys + SymbiYosys + Z3)
  # 14 suites, 77+ properties
  # ----------------------------------------------------------------
  formal-verification:
    needs: build-microcode
    runs-on: ubuntu-24.04
    # 75, not 45. The proofs themselves take ~19 min, so 45 looked like ample
    # headroom -- but a COLD yosys cache adds a ~25 min build, and 25 + 19 plus
    # setup does not fit in 45. That was already true before the install-tree
    # fix below; it simply never bit until a cache went cold, and then it
    # presented as a formal timeout rather than as a build cost.
    #
    # GitHub evicts a cache after 7 days without a hit, so any quiet week
    # brings the cold path back. The budget has to cover it or the failure
    # recurs on a schedule nobody is watching for.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: build/microcode/

      - name: Install yosys build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang bison flex libreadline-dev \
            gawk tcl-dev libffi-dev pkg-config python3 zlib1g-dev

      # CACHE THE INSTALLED TREE, NOT THE BUILD TREE.
      #
      # This cached /tmp/yosys (the build tree) and then ran `make install` on
      # it. The cache HIT -- 290 MB restored -- and `make install` REBUILT
      # yosys from source anyway, 307 compiler invocations taking 27 of the
      # job's 45 minutes and leaving 15 for proofs that need 19. The job then
      # died on the wall with z3 still running, reporting only "exceeded the
      # maximum execution time", which reads exactly like a formal regression:
      # two commits were investigated as one before the log showed the rebuild.
      #
      # `make install` re-derives kernel/version_*.cc from the git state, and a
      # restored tree does not reproduce it, so every object downstream is
      # stale. Caching the build tree can therefore never be reliable here.
      # DESTDIR staging is: the install output is a handful of files with no
      # build rules behind them, so restoring it cannot trigger a rebuild.
      - name: Cache yosys install
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: /tmp/yosys-install
          key: yosys-install-v0.52-2

      - name: Build and stage yosys 0.52 from source
        if: steps.cache-yosys.outputs.cache-hit != 'true'
        run: |
          git clone --branch v0.52 --depth 1 --recursive https://github.com/YosysHQ/yosys.git /tmp/yosys
          cd /tmp/yosys && make config-clang && make -j$(nproc)
          make install DESTDIR=/tmp/yosys-install PREFIX=/usr/local

      - name: Install yosys, z3, and SymbiYosys
        run: |
          sudo cp -a /tmp/yosys-install/usr/local/. /usr/local/
          yosys -V
          # z3 from apt is 4.8.12 (too old for yosys 0.52 SMT2 output)
          # Install z3 4.16.0 from GitHub (apt z3 4.8.12 is too old for yosys 0.52 SMT2)
          curl -L -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          unzip -q /tmp/z3.zip -d /tmp && sudo cp /tmp/z3-4.16.0-x64-glibc-2.39/bin/z3 /usr/local/bin/
          git clone --branch v0.62 --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          cd /tmp/sby && sudo make install PREFIX=/usr/local

      - name: Run formal verification
        run: |
          sbt -J-Xmx4g "testOnly jop.formal.* -- -u target/scalatest-reports" 2>&1 | tee suite.log
          # PIPESTATUS, not $?: the pipe through tee would otherwise report
          # tee's status and hide an sbt failure entirely (item 111).
          exit ${PIPESTATUS[0]}

      # THE FILTER MATCHING NOTHING EXITS 0 -- status item 111.
      #
      #   $ sbt "testOnly jop.formal.NoSuchSuiteAtAll"
      #   [info] No tests to run for Test / testOnly
      #   [success] Total time: 0 s
      #   $ echo $?
      #   0
      #
      # Measured, not assumed. So a package rename, a moved suite or a typo in
      # the filter above silently drops EVERY test here and this job stays
      # green -- the "reported success without executing" shape, which bit four
      # separate checks on 2026-09-03. sbt's exit status cannot distinguish
      # "all passed" from "none ran"; the count can.
      - name: Assert the suite actually ran
        env:
          # 134 actually run today (measured 2026-09-04). The floor is set well
          # below that so legitimately removing a suite does not break the job,
          # while "the filter stopped matching most things" still fails. The
          # exact defence is the `No tests to run` check above; this is the
          # partial-match backstop.
          MIN_TESTS: 50
        run: |
          if grep -q 'No tests to run' suite.log; then
            echo "::error::the testOnly filter matched NOTHING — sbt exits 0 for this"
            grep -n 'No tests to run' suite.log
            exit 1
          fi
          n=$(grep -oE 'Tests: succeeded [0-9]+' suite.log | grep -oE '[0-9]+$' | tail -1)
          n=${n:-0}
          echo "tests executed: $n (floor $MIN_TESTS)"
          if [ "$n" -lt "$MIN_TESTS" ]; then
            echo "::error::only $n test(s) ran, expected at least $MIN_TESTS"
            exit 1
          fi

      # ScalaTest's -u writer emits XML that is valid often enough to pass
      # locally and fail on a runner — three separate reporting-only breakages
      # so far, each turning a green build red. Stripping the known offenders
      # one at a time did not converge (the 2026-08-10 scheduled run still hit
      # "Invalid XML" with the <properties> block already gone). The script
      # round-trips every file through a real parser and, if one cannot be
      # parsed, degrades it to a counts-only stub — so the reporter is
      # guaranteed well-formed input. See the script header for the full list.
      - name: Sanitise JUnit XML before reporting
        id: sanitise
        if: always()
        run: python3 .github/scripts/sanitise-junit-xml.py

      - name: Publish formal test results
        id: formal-reporter
        uses: dorny/test-reporter@v1
        if: always()
        # `fail-on-error: false` is NOT sufficient: the 2026-08-10 scheduled run
        # set it and the step still failed the job on "Invalid XML", because
        # that option covers failing TESTS, not a parse error in the action
        # itself. continue-on-error is the only thing that actually stops a
        # reporting fault from deciding whether CI is green.
        continue-on-error: true
        with:
          name: Formal Verification Results
          path: target/scalatest-reports/**/*.xml
          reporter: java-junit
          # The reporter must not decide whether CI is green. It parses
          # ScalaTest's -u XML, which is fragile: the 2026-08-09 run had
          # "Tests: succeeded 460, failed 0" and still failed the job with
          # "Invalid attribute name" -- a REPORTING bug turning a fully green
          # run red. The sanitise step above already strips the known offender
          # (the <properties> block) and had run on that very file, so the
          # remaining breakage is in ScalaTest's escaping, not something CI can
          # reliably pre-clean.
          #
          # Genuine test failures are still gated: sbt exits non-zero on a
          # failed test and the "Run ..." step above fails the job. This only
          # stops a presentation layer from vetoing a passing build.
          fail-on-error: false

      # Capture the evidence when the reporter rejects a file. `outcome`, NOT
      # `conclusion`: continue-on-error rewrites conclusion to "success", so a
      # condition on conclusion would never fire. Both directories go up —
      # -raw holds the pristine ScalaTest output (the sanitiser edits in place,
      # so the sanitised copy alone would be valid XML and prove nothing), and
      # the sanitised copy shows what the reporter was actually handed.
      - name: Upload test reports on reporter failure
        if: always() && (steps.formal-reporter.outcome == 'failure' || steps.sanitise.outputs.stubbed != '0')
        uses: actions/upload-artifact@v4
        with:
          name: formal-test-reports-${{ github.run_id }}
          path: |
            target/scalatest-reports/
            target/scalatest-reports-raw/
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # Simulation tests (Verilator)
  # Component-level tests: core, IO, pipeline, memory, DDR3
  # Skips jop.system.* (needs .jop files built with JDK 1.6)
  # ----------------------------------------------------------------
  simulation-tests:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: build/microcode/

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # jop.system.* and jop.utils.* are deliberately NOT here: JopCoreTest,
      # JopCoreWithSdramTest and JopFileLoaderSpec all load
      # java/apps/Smallest/HelloWorld.jop, which is a gitignored build artifact.
      # CI builds jopa.jar and the microcode but not the Java apps — those need
      # JDK 6 — so those three fail in CI while passing locally. Adding the
      # packages wholesale is exactly the mistake that broke this job once.
      - name: Run simulation tests
        run: |
          sbt -J-Xmx4g "testOnly jop.core.* jop.io.* jop.pipeline.* jop.memory.* jop.ddr3.* jop.config.* jop.sim.* -- -u target/scalatest-reports" 2>&1 | tee suite.log
          exit ${PIPESTATUS[0]}

      # THE FILTER MATCHING NOTHING EXITS 0 -- status item 111.
      #
      #   $ sbt "testOnly jop.formal.NoSuchSuiteAtAll"
      #   [info] No tests to run for Test / testOnly
      #   [success] Total time: 0 s
      #   $ echo $?
      #   0
      #
      # Measured, not assumed. So a package rename, a moved suite or a typo in
      # the filter above silently drops EVERY test here and this job stays
      # green -- the "reported success without executing" shape, which bit four
      # separate checks on 2026-09-03. sbt's exit status cannot distinguish
      # "all passed" from "none ran"; the count can.
      - name: Assert the suite actually ran
        env:
          # `sbt test` is 666 tests total, of which jop.formal.* is 134, so this
          # filter covers roughly 500. Floor set with the same headroom rule.
          MIN_TESTS: 200
        run: |
          if grep -q 'No tests to run' suite.log; then
            echo "::error::the testOnly filter matched NOTHING — sbt exits 0 for this"
            grep -n 'No tests to run' suite.log
            exit 1
          fi
          n=$(grep -oE 'Tests: succeeded [0-9]+' suite.log | grep -oE '[0-9]+$' | tail -1)
          n=${n:-0}
          echo "tests executed: $n (floor $MIN_TESTS)"
          if [ "$n" -lt "$MIN_TESTS" ]; then
            echo "::error::only $n test(s) ran, expected at least $MIN_TESTS"
            exit 1
          fi

      # ScalaTest's -u writer emits XML that is valid often enough to pass
      # locally and fail on a runner — three separate reporting-only breakages
      # so far, each turning a green build red. Stripping the known offenders
      # one at a time did not converge (the 2026-08-10 scheduled run still hit
      # "Invalid XML" with the <properties> block already gone). The script
      # round-trips every file through a real parser and, if one cannot be
      # parsed, degrades it to a counts-only stub — so the reporter is
      # guaranteed well-formed input. See the script header for the full list.
      - name: Sanitise JUnit XML before reporting
        id: sanitise
        if: always()
        run: python3 .github/scripts/sanitise-junit-xml.py

      - name: Publish simulation test results
        id: sim-reporter
        uses: dorny/test-reporter@v1
        if: always()
        # `fail-on-error: false` is NOT sufficient: the 2026-08-10 scheduled run
        # set it and the step still failed the job on "Invalid XML", because
        # that option covers failing TESTS, not a parse error in the action
        # itself. continue-on-error is the only thing that actually stops a
        # reporting fault from deciding whether CI is green.
        continue-on-error: true
        with:
          name: Simulation Test Results
          path: target/scalatest-reports/**/*.xml
          reporter: java-junit
          # The reporter must not decide whether CI is green. It parses
          # ScalaTest's -u XML, which is fragile: the 2026-08-09 run had
          # "Tests: succeeded 460, failed 0" and still failed the job with
          # "Invalid attribute name" -- a REPORTING bug turning a fully green
          # run red. The sanitise step above already strips the known offender
          # (the <properties> block) and had run on that very file, so the
          # remaining breakage is in ScalaTest's escaping, not something CI can
          # reliably pre-clean.
          #
          # Genuine test failures are still gated: sbt exits non-zero on a
          # failed test and the "Run ..." step above fails the job. This only
          # stops a presentation layer from vetoing a passing build.
          fail-on-error: false

      # See the note on the formal job's equivalent step. This is the one that
      # actually fired on 2026-08-10 ("Invalid XML" on
      # TEST-jop.pipeline.BytecodeFetchStageTest.xml) with no way to inspect the
      # file, which is why the trigger is still only suspected rather than known.
      - name: Upload test reports on reporter failure
        if: always() && (steps.sim-reporter.outcome == 'failure' || steps.sanitise.outputs.stubbed != '0')
        uses: actions/upload-artifact@v4
        with:
          name: simulation-test-reports-${{ github.run_id }}
          path: |
            target/scalatest-reports/
            target/scalatest-reports-raw/
          retention-days: 14
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # JVM test suite (jvm.DoAll) across bytecode implementation choices.
  #
  # NOT run on push or PR: each of these is a 60M-cycle Verilator run taking
  # tens of minutes, which would make every push unbearable. Nightly and on
  # manual dispatch instead.
  #
  # Why they need to exist at all: a bytecode implementation that no test
  # SELECTS gets no coverage, and JOP's defaults select very few microcode
  # handlers. lmul_sw was broken for months precisely because lmul defaults to
  # Java on every board, so nothing ran it. These three runs cover every
  # implementation choice that currently works:
  #
  #   baseline     every bytecode at its default -> covers all Java handlers
  #   mc-fallback  every working _sw handler     -> covers all microcode
  #   all-hw       "*" -> "hw"                   -> covers all four CUs
  #
  # Deliberately absent: lmul = mc (lmul_sw is broken) and fadd/fsub/fmul/fdiv
  # = mc (their _sw handlers drive the removed BmbFpu). See item 22 in
  # docs/current-status.md. JopJvmTestsLmulSwSim reproduces the lmul failure on
  # demand and is expected to fail, so it is not run here.
  # ----------------------------------------------------------------
  # Decides whether jvm-suite-sims runs. Push, PR and manual dispatch always
  # run it. Only the nightly is gated, and only to skip re-testing identical
  # code when nothing was committed since the last one.
  #
  # This job must NOT be restricted by event: a skipped job makes everything
  # that `needs` it skip too, which would silently disable the sims on push.
  check-recent-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }} — running"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "commits in the last 24h — running"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "no commits in the last 24h — skipping the JVM suite sims"
          fi

  # Runs on every push and PR, plus nightly. This takes CI from ~6 minutes to
  # ~18, which is the deliberate trade: these sims are the only thing that
  # exercises the JVM suite end to end, and while they were nightly-only a
  # green push tick said nothing about them — a break could sit undetected for
  # a day. Minutes are free on a public repo, so the only price is latency, and
  # `concurrency.cancel-in-progress` means a rapid series of pushes cancels the
  # superseded runs rather than queueing them.
  #
  # If this becomes too slow to live with, prefer trimming the matrix (the
  # baseline sim is the one that has caught real regressions) over going back
  # to nightly-only.
  jvm-suite-sims:
    needs: [build-microcode, check-recent-commits]
    if: needs.check-recent-commits.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline (all defaults, Java handlers)
            sim: JopJvmTestsBramSim
          - name: microcode fallbacks
            sim: JopJvmTestsMcFallbackSim
            # Seed pin REMOVED 2026-08-18 — see the note on the Run step.
          - name: all compute units
            sim: JopDcuCacheSim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: build/microcode

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # DoAll.jop is a gitignored build artifact, so CI has to build it. That
      # needs JDK 8 specifically: the app compiles with -source/-target 1.6, and
      # JDK 9 dropped target 6, while JOPizer's BCEL 5.2 cannot read class files
      # newer than Java 6. JDK 8 is the only version satisfying both. JAVA_HOME
      # stays on 17 for sbt and the tools; only javac for the app is pinned.
      - name: Set up JDK 8 for the JOP app compile
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17 (sbt, tools, JOPizer)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the java/ Makefile targets, not java/tools directly: JOPizer imports
      # com.jopdesign.sys.Const, which is generated from JopConfig and
      # gitignored, so building the tools first fails with 'cannot find symbol'.
      # `make -C java tools` declares that dependency; calling the sub-make
      # bypasses it. Locally it is masked because Const.java already exists.
      - name: Build JOP tools and DoAll.jop
        # TARGET_JDK_HOME as step env, not a make argument: seven Makefiles set
        # it with ?=, so one environment variable overrides all of them. Passing
        # it to a single sub-make only moves the failure to the next one that
        # needs it. (Was JDK6_HOME until 2026-08-09 — the name was a lie here,
        # since this points at a JDK 8.)
        env:
          TARGET_JDK_HOME: ${{ steps.jdk8.outputs.path }}
        run: |
          make -C java tools
          make -C java runtime
          make -C java/apps/JvmTests
          ls -l java/apps/JvmTests/DoAll.jop

      # Hash the sim's inputs on EVERY run, passing or failing. Chasing the
      # item 30 intermittent failure, the only evidence that the failing run's
      # DoAll.jop matched the passing run's was `ls -l` size — and equal size is
      # not equal content. Hashes make that comparison exact, and because they
      # are recorded on green runs too there is always a known-good baseline to
      # diff a future failure against.
      - name: Fingerprint sim inputs
        run: |
          # The simulator build is an input too. A seed names an initial state
          # only relative to a fixed netlist AND a fixed Verilator; replaying
          # CI's seed on a workstation running a different version reproduces
          # nothing, which is how item 30's seed hypothesis got wrongly cleared
          # (CI 5.020 from noble apt, the workstation 5.032 from Debian).
          verilator --version
          sha256sum \
            java/apps/JvmTests/DoAll.jop \
            build/microcode/simulation/mem_rom.dat \
            build/microcode/simulation/mem_ram.dat \
            build/microcode/simulation/JumpTableData.scala \
            java/runtime/src/jop/com/jopdesign/sys/Const.java \
            | tee fingerprints.txt

      # --no-colors matters: with ANSI escapes sbt's output lines do not END in
      # "ok", they end in the colour reset, so a ' ok$' grep silently matches
      # nothing and a passing run looks like a run that never started. Locally
      # sbt does not colourise when piped, which is why this only shows up here.
      # The sed is belt and braces in case something else emits escapes.
      # The seed pin that used to live here is GONE (2026-08-18). It existed
      # because JopJvmTestsMcFallbackSim failed on seed 871203250 with every
      # UART character corrupted (bits 1 and 3 cleared), so CI was pinned to
      # 284409762 to stay honest about regressions meanwhile — item 32.
      #
      # Two things retired it. First, the sims now zero X-state
      # (--x-initial 0, jop.utils.JopSimDefaults), which removes the only
      # source of run-to-run variation these sims have: with it, every seed
      # selects the same initial state, so pinning one is meaningless.
      # Second, the failure no longer reproduces at HEAD at all — seed
      # 871203250 gives 132 ok and 0 corrupt lines under BOTH the zeroed and
      # the randomised setting, as do 284409762, -1337 and 20260818.
      #
      # What is NOT established is WHY it stopped: the netlist has moved a
      # long way since (the MSHR work), and a seed only names an initial state
      # relative to a fixed netlist. The corruption was real when measured
      # (ok=0 corrupt=61, confirmed pre-existing by an A/B at f65b05b), so
      # item 32 stays open as "observed once, not currently reachable" rather
      # than "fixed". Reproduce attempts:
      #   JOP_SIM_SEED=871203250 JOP_SIM_XINIT=random \
      #     sbt "Test/runMain jop.system.JopJvmTestsMcFallbackSim"
      #
      # matrix.seed is still honoured, so re-pinning is a one-line change if
      # some future seed misbehaves.
      - name: Run ${{ matrix.name }}
        env:
          JOP_SIM_SEED: ${{ matrix.seed }}
        run: |
          sbt -J-Xmx4g --no-colors "Test/runMain jop.system.${{ matrix.sim }}" 2>&1 \
            | sed -r 's/\x1B\[[0-9;]*[mK]//g' | tee sim.log

      - name: Check DoAll result
        run: |
          # These sims are App objects: they exit 0 whatever the suite reports,
          # so the verdict has to be read out of the log or a regression passes
          # silently.
          fails=$(grep -c 'failed!' sim.log || true)
          # Two result formats: DoAll prints "<name> ok" per test, JopDcuCacheSim
          # prints a summary line. Accept either as evidence the suite ran.
          oks=$(grep -cE '[A-Za-z0-9_)] ok[[:space:]]*$' sim.log || true)
          summary=$(grep -cE 'All [0-9]+ tests passed|Tests passed: [0-9]+/[0-9]+' sim.log || true)
          echo "per-test ok lines=$oks  summary lines=$summary  failed=$fails"
          # The seed is what makes these sims reproducible: item 29 was pinned
          # down only by re-running with the seed from the failing job. Surface
          # it here so it is readable without downloading the log.
          # -?: seeds are signed 32-bit and negative ones are common. Without
          # the sign this prints a different (positive) seed, so anyone
          # replaying it reproduces the wrong run. The 2026-08-15 baseline
          # failure was seed -748081925.
          grep -oE 'with seed -?[0-9]+' sim.log | head -1 || true
          if [ "$fails" -ne 0 ]; then
            echo "::error::${{ matrix.name }}: $fails test(s) failed"
            grep 'failed!' sim.log
            exit 1
          fi
          if [ "$oks" -eq 0 ] && [ "$summary" -eq 0 ]; then
            echo "::error::${{ matrix.name }}: no results found — the suite did not run to completion"
            tail -40 sim.log
            exit 1
          fi

      # simWorkspace is the one piece of a failing run that cannot be
      # reconstructed afterwards — it dies with the runner. Both CI failures so
      # far (items 29 and 30) were intermittent and did NOT reproduce locally on
      # the same commit, seed and inputs, which left nothing to examine after the
      # fact. Collect on failure only.
      #
      # Only the generated Verilog is worth keeping: Verilator's obj_dir is
      # hundreds of MB of .o/.cpp that rebuild from the .v anyway. Every copy is
      # `|| true` — a diagnostics step must never be the reason a run reports a
      # different failure than the real one.
      - name: Collect failure diagnostics
        if: failure()
        run: |
          out=sim-diagnostics
          mkdir -p "$out"
          cp sim.log fingerprints.txt "$out"/ 2>/dev/null || true
          find simWorkspace -name '*.v' -o -name '*.sv' 2>/dev/null \
            | tar -czf "$out"/generated-verilog.tar.gz -T - 2>/dev/null || true
          # Waveforms only if the sim was configured to write them, and only if
          # small enough to be worth uploading.
          find simWorkspace \( -name '*.fst' -o -name '*.vcd' \) -size -100M \
            -exec cp {} "$out"/ \; 2>/dev/null || true
          cp java/apps/JvmTests/DoAll.jop "$out"/ 2>/dev/null || true
          cp build/microcode/simulation/mem_rom.dat build/microcode/simulation/mem_ram.dat "$out"/ 2>/dev/null || true
          cp java/runtime/src/jop/com/jopdesign/sys/Const.java "$out"/ 2>/dev/null || true
          ls -lR "$out"
          du -sh "$out"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # matrix.sim, not matrix.name: the names contain spaces and parens.
          name: sim-diagnostics-${{ matrix.sim }}
          path: sim-diagnostics
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Card-table tests (status item 131).
  #
  # A SEPARATE JOB, not another entry in jvm-suite-sims, for one reason:
  # JopCardClearStallSim loads CardMarkTest.jop from java/apps/Small, and that
  # matrix builds only java/apps/JvmTests. Adding the app there would build it
  # three times over to serve one entry.
  #
  # WHY THESE NEEDED WIRING AT ALL. Both are `App` objects, so CI's unit job --
  # `testOnly jop.core.* ... jop.memory.* ...` -- cannot see them: testOnly
  # matches ScalaTest suites only. Until this job existed, the whole of item
  # 131's coverage ran on a workstation and nowhere else, which is also why
  # CardTableTest had no case for marking during a sweep for as long as it
  # didn't.
  #
  # Both check CONTENT, never the exit status. An App exits 0 whatever it
  # printed, and on 2026-09-03 four separate checks in one session reported
  # success without having executed at all (item 111) -- including a pre-push
  # sim gate that announced "zero NO DRIVER" for three simulations that never
  # started, because nothing had elaborated.
  card-table-tests:
    needs: [build-microcode, check-recent-commits]
    if: needs.check-recent-commits.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # REQUIRED, and easy to miss: the runner image has no sbt. Every other job
      # in this file pairs setup-sbt with the cache step below; copying only the
      # cache gives "sbt: not found" at the first `make -C java runtime`, which
      # shells out to sbt for Const.java.
      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: build/microcode

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # Same JDK split as jvm-suite-sims: JDK 8 for the app compile (-target 1.6
      # plus BCEL 5.2), 17 for sbt and the tools.
      - name: Set up JDK 8 for the JOP app compile
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17 (sbt, tools, JOPizer)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JOP tools and CardMarkTest.jop
        env:
          TARGET_JDK_HOME: ${{ steps.jdk8.outputs.path }}
        run: |
          make -C java tools
          make -C java runtime
          make -C java/apps/Small APP_NAME=CardMarkTest APP_PKG=test
          ls -l java/apps/Small/CardMarkTest.jop

      # CardTableTest needs no .jop and takes seconds. It covers marking,
      # tenure-window gating, the RMW forwarding path, and -- since item 131 --
      # that clrBusy spans the request cycle, the mark-pipeline drain and the
      # whole sweep, at all five real board geometries (1024 to 16384 table
      # words). The A-E115FB's 16384 is in there because that board could not be
      # programmed on 2026-09-02 and its sweep length is a parameter, not a
      # property of its DDR2.
      - name: CardTable component tests
        run: sbt "Test/runMain jop.memory.CardTableTest" 2>&1 | tee cardtable.log

      - name: Check CardTable result
        run: |
          # An App exits 0 regardless; read the verdict out of the log.
          # NOT ^PASS: sbt prefixes every line with "[info] ", so an anchored
          # pattern matches nothing and this check fails a PASSING test.
          # Verified against a real log before committing.
          both=$(grep -c 'PASS:' cardtable.log || true)
          echo "PASS lines=$both (expect 2: the base suite, and the geometry sweep)"
          if grep -qE 'FAIL:|FAILED \(' cardtable.log; then
            echo "::error::CardTableTest reported a failure"
            grep -E 'FAIL:|FAILED \(' cardtable.log
            exit 1
          fi
          # Absence of FAIL is not presence of a run: demand both PASS lines.
          if [ "$both" -ne 2 ]; then
            echo "::error::CardTableTest did not run to completion (PASS lines=$both, expected 2)"
            tail -40 cardtable.log
            exit 1
          fi

      # Does IO_CARD_CLEAR actually stall the core? The three-board hardware
      # validation and a million GcStressTest rounds cannot answer that: a
      # dropped mark costs a live object only when a cross-generation store
      # lands in the window AND that object has no other root, so a soak passing
      # is not evidence the stall happened.
      - name: Card-clear stall simulation
        run: sbt "Test/runMain jop.system.JopCardClearStallSim" 2>&1 | tee cardstall.log

      - name: Check stall result
        run: |
          if grep -q 'FAIL:' cardstall.log; then
            echo "::error::the card-clear stall check failed"
            grep -E 'FAIL:|longest stall|sweep' cardstall.log
            exit 1
          fi
          if ! grep -q 'PASS: IO_CARD_CLEAR stalls the core' cardstall.log; then
            echo "::error::JopCardClearStallSim produced no verdict — it did not run to completion"
            tail -40 cardstall.log
            exit 1
          fi
          grep -E 'longest stall|the sweep should be' cardstall.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: card-table-diagnostics
          path: |
            cardtable.log
            cardstall.log
          retention-days: 14
          if-no-files-found: warn
