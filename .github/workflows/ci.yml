name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly, for the JVM-suite simulations only — they are far too slow to
    # gate a push (60M Verilator cycles each).
    - cron: '0 3 * * *'

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Build Java tools + microcode assembly
  # Produces asm/generated/ (Scala sources + ROM/RAM data files)
  # ----------------------------------------------------------------
  build-microcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Java tools (jopa.jar)
        run: make -C java/tools dist/jopa.jar

      - name: Build microcode (superset ROM)
        run: cd asm && make && make serial && make flash-altera

      - name: Upload microcode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: microcode
          path: asm/generated/
          retention-days: 1

  # ----------------------------------------------------------------
  # SBT compile + Verilog generation
  # ----------------------------------------------------------------
  compile-and-generate:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: asm/generated/

      - name: SBT compile (main + test)
        run: sbt -J-Xmx4g compile Test/compile

      - name: Generate Verilog
        run: sbt -J-Xmx4g "runMain jop.system.JopCoreVerilog"

  # ----------------------------------------------------------------
  # Formal verification (yosys + SymbiYosys + Z3)
  # 14 suites, 77+ properties
  # ----------------------------------------------------------------
  formal-verification:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: asm/generated/

      - name: Install yosys build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang bison flex libreadline-dev \
            gawk tcl-dev libffi-dev pkg-config python3 zlib1g-dev

      - name: Cache yosys build
        id: cache-yosys
        uses: actions/cache@v4
        with:
          path: /tmp/yosys
          key: yosys-v0.52

      - name: Build yosys 0.52 from source
        if: steps.cache-yosys.outputs.cache-hit != 'true'
        run: |
          git clone --branch v0.52 --depth 1 --recursive https://github.com/YosysHQ/yosys.git /tmp/yosys
          cd /tmp/yosys && make config-clang && make -j$(nproc)

      - name: Install yosys, z3, and SymbiYosys
        run: |
          cd /tmp/yosys && sudo make install
          # z3 from apt is 4.8.12 (too old for yosys 0.52 SMT2 output)
          # Install z3 4.16.0 from GitHub (apt z3 4.8.12 is too old for yosys 0.52 SMT2)
          curl -L -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          unzip -q /tmp/z3.zip -d /tmp && sudo cp /tmp/z3-4.16.0-x64-glibc-2.39/bin/z3 /usr/local/bin/
          git clone --branch v0.62 --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          cd /tmp/sby && sudo make install PREFIX=/usr/local

      - name: Run formal verification
        run: sbt -J-Xmx4g "testOnly jop.formal.* -- -u target/test-reports"

      # ScalaTest's -u writer dumps all 64 JVM system properties into a
      # <properties> block, unescaped and all on one line — line.separator's
      # value is a literal newline inside an attribute. It parses locally but
      # broke dorny/test-reporter on CI with "Invalid attribute name" at a line
      # that is inside that block, and the values there differ between runners,
      # so the failure is environment-dependent and not reproducible locally.
      # None of it is test data. Strip the block and any stray control
      # characters before the reporter sees the file.
      - name: Sanitise JUnit XML before reporting
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, re, sys
          ctrl = re.compile(rb'[\x00-\x08\x0b\x0c\x0e-\x1f]')
          for f in glob.glob('target/test-reports/**/*.xml', recursive=True):
              d = open(f, 'rb').read()
              n = re.sub(rb'<properties>.*?</properties>', b'<properties/>', d, flags=re.S)
              n = ctrl.sub(b'', n)
              if n != d:
                  open(f, 'wb').write(n)
                  print('sanitised', f)
          PYEOF

      - name: Publish formal test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Formal Verification Results
          path: target/test-reports/**/*.xml
          reporter: java-junit

  # ----------------------------------------------------------------
  # Simulation tests (Verilator)
  # Component-level tests: core, IO, pipeline, memory, DDR3
  # Skips jop.system.* (needs .jop files built with JDK 1.6)
  # ----------------------------------------------------------------
  simulation-tests:
    needs: build-microcode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: sbt-

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: asm/generated/

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # jop.system.* and jop.utils.* are deliberately NOT here: JopCoreTest,
      # JopCoreWithSdramTest and JopFileLoaderSpec all load
      # java/apps/Smallest/HelloWorld.jop, which is a gitignored build artifact.
      # CI builds jopa.jar and the microcode but not the Java apps — those need
      # JDK 6 — so those three fail in CI while passing locally. Adding the
      # packages wholesale is exactly the mistake that broke this job once.
      - name: Run simulation tests
        run: sbt -J-Xmx4g "testOnly jop.core.* jop.io.* jop.pipeline.* jop.memory.* jop.ddr3.* jop.config.* jop.sim.* -- -u target/test-reports"

      # ScalaTest's -u writer dumps all 64 JVM system properties into a
      # <properties> block, unescaped and all on one line — line.separator's
      # value is a literal newline inside an attribute. It parses locally but
      # broke dorny/test-reporter on CI with "Invalid attribute name" at a line
      # that is inside that block, and the values there differ between runners,
      # so the failure is environment-dependent and not reproducible locally.
      # None of it is test data. Strip the block and any stray control
      # characters before the reporter sees the file.
      - name: Sanitise JUnit XML before reporting
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, re, sys
          ctrl = re.compile(rb'[\x00-\x08\x0b\x0c\x0e-\x1f]')
          for f in glob.glob('target/test-reports/**/*.xml', recursive=True):
              d = open(f, 'rb').read()
              n = re.sub(rb'<properties>.*?</properties>', b'<properties/>', d, flags=re.S)
              n = ctrl.sub(b'', n)
              if n != d:
                  open(f, 'wb').write(n)
                  print('sanitised', f)
          PYEOF

      - name: Publish simulation test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Simulation Test Results
          path: target/test-reports/**/*.xml
          reporter: java-junit

  # ----------------------------------------------------------------
  # JVM test suite (jvm.DoAll) across bytecode implementation choices.
  #
  # NOT run on push or PR: each of these is a 60M-cycle Verilator run taking
  # tens of minutes, which would make every push unbearable. Nightly and on
  # manual dispatch instead.
  #
  # Why they need to exist at all: a bytecode implementation that no test
  # SELECTS gets no coverage, and JOP's defaults select very few microcode
  # handlers. lmul_sw was broken for months precisely because lmul defaults to
  # Java on every board, so nothing ran it. These three runs cover every
  # implementation choice that currently works:
  #
  #   baseline     every bytecode at its default -> covers all Java handlers
  #   mc-fallback  every working _sw handler     -> covers all microcode
  #   all-hw       "*" -> "hw"                   -> covers all four CUs
  #
  # Deliberately absent: lmul = mc (lmul_sw is broken) and fadd/fsub/fmul/fdiv
  # = mc (their _sw handlers drive the removed BmbFpu). See item 22 in
  # docs/current-status.md. JopJvmTestsLmulSwSim reproduces the lmul failure on
  # demand and is expected to fail, so it is not run here.
  # ----------------------------------------------------------------
  # Skips a scheduled run when nothing was committed since the last one, so the
  # nightly does not burn ~30 minutes re-testing identical code. Manual dispatch
  # always runs.
  check-recent-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — running"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "commits in the last 24h — running"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "no commits in the last 24h — skipping the JVM suite sims"
          fi

  jvm-suite-sims:
    needs: [build-microcode, check-recent-commits]
    if: needs.check-recent-commits.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline (all defaults, Java handlers)
            sim: JopJvmTestsBramSim
          - name: microcode fallbacks
            sim: JopJvmTestsMcFallbackSim
          - name: all compute units
            sim: JopDcuCacheSim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}

      - name: Download microcode
        uses: actions/download-artifact@v4
        with:
          name: microcode
          path: asm/generated

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # DoAll.jop is a gitignored build artifact, so CI has to build it. That
      # needs JDK 8 specifically: the app compiles with -source/-target 1.6, and
      # JDK 9 dropped target 6, while JOPizer's BCEL 5.2 cannot read class files
      # newer than Java 6. JDK 8 is the only version satisfying both. JAVA_HOME
      # stays on 17 for sbt and the tools; only javac for the app is pinned.
      - name: Set up JDK 8 for the JOP app compile
        id: jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17 (sbt, tools, JOPizer)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the java/ Makefile targets, not java/tools directly: JOPizer imports
      # com.jopdesign.sys.Const, which is generated from JopConfig and
      # gitignored, so building the tools first fails with 'cannot find symbol'.
      # `make -C java tools` declares that dependency; calling the sub-make
      # bypasses it. Locally it is masked because Const.java already exists.
      - name: Build JOP tools and DoAll.jop
        # JDK6_HOME as step env, not a make argument: seven Makefiles default it
        # to /opt/jdk1.6.0_45 with ?=, so one environment variable overrides all
        # of them. Passing it to a single sub-make only moves the failure to the
        # next one that needs it.
        env:
          JDK6_HOME: ${{ steps.jdk8.outputs.path }}
        run: |
          make -C java tools
          make -C java runtime
          make -C java/apps/JvmTests
          ls -l java/apps/JvmTests/DoAll.jop

      # --no-colors matters: with ANSI escapes sbt's output lines do not END in
      # "ok", they end in the colour reset, so a ' ok$' grep silently matches
      # nothing and a passing run looks like a run that never started. Locally
      # sbt does not colourise when piped, which is why this only shows up here.
      # The sed is belt and braces in case something else emits escapes.
      - name: Run ${{ matrix.name }}
        run: |
          sbt -J-Xmx4g --no-colors "Test/runMain jop.system.${{ matrix.sim }}" 2>&1 \
            | sed -r 's/\x1B\[[0-9;]*[mK]//g' | tee sim.log

      - name: Check DoAll result
        run: |
          # These sims are App objects: they exit 0 whatever the suite reports,
          # so the verdict has to be read out of the log or a regression passes
          # silently.
          fails=$(grep -c 'failed!' sim.log || true)
          # Two result formats: DoAll prints "<name> ok" per test, JopDcuCacheSim
          # prints a summary line. Accept either as evidence the suite ran.
          oks=$(grep -cE '[A-Za-z0-9_)] ok[[:space:]]*$' sim.log || true)
          summary=$(grep -cE 'All [0-9]+ tests passed|Tests passed: [0-9]+/[0-9]+' sim.log || true)
          echo "per-test ok lines=$oks  summary lines=$summary  failed=$fails"
          if [ "$fails" -ne 0 ]; then
            echo "::error::${{ matrix.name }}: $fails test(s) failed"
            grep 'failed!' sim.log
            exit 1
          fi
          if [ "$oks" -eq 0 ] && [ "$summary" -eq 0 ]; then
            echo "::error::${{ matrix.name }}: no results found — the suite did not run to completion"
            tail -40 sim.log
            exit 1
          fi
